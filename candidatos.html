<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatos — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .jornada-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
  .jornada-card h3 { color: var(--gold); font-size: 1rem; margin-bottom: 4px; }
  .jornada-card .jugador-destacado { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; }
  .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .img-grid { grid-template-columns: 1fr; } }
  .img-box { text-align: center; }
  .img-box img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--line); display: block; margin-bottom: 8px; }
  .img-box .caption { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>⚔ Comunidad AoE II</h1>
    <span class="sub">Candidatos al Jugador de la Fecha</span>
  </div>
  <nav class="tabs">
    <a href="index.html">Inicio</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html" class="active">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <p class="hint" style="margin-bottom:14px;">Mostrando las últimas 5 fechas (máximo 10 partidas) con infografías cargadas.</p>
  <div id="lista-partidas"></div>
</main>

<nav class="mobile-nav">
  <a href="index.html"><span class="icon">🏠</span>Inicio</a>
  <a href="clasificacion.html"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html" class="active"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
const LIMITE_FECHAS = 5;
const LIMITE_PARTIDAS = 10;

function render(partidas) {
  const cont = document.getElementById("lista-partidas");

  const conImagenes = partidas.filter(p => p.imagenEvaluacion || p.imagenGalardon);

  if (conImagenes.length === 0) {
    cont.innerHTML = `<div class="empty-state">No hay infografías cargadas todavía.</div>`;
    return;
  }

  conImagenes.sort((a, b) => claveOrden(b) - claveOrden(a));

  // Limitar a las últimas 5 jornadas distintas (identificadas por año+mes+jornada)
  const claveJornada = p => `${p.anio}-${p.mes}-${p.jornada}`;
  const jornadasUnicas = [...new Set(conImagenes.map(claveJornada))].slice(0, LIMITE_FECHAS);
  let filtradas = conImagenes.filter(p => jornadasUnicas.includes(claveJornada(p)));

  filtradas = filtradas.slice(0, LIMITE_PARTIDAS);

  cont.innerHTML = filtradas.map(p => `
    <div class="jornada-card">
      <h3>${etiquetaPartida(p)}</h3>
      <div class="jugador-destacado">👑 Jugador destacado: <strong>${p.jugadorDestacado || "—"}</strong></div>
      <div class="img-grid">
        ${p.imagenEvaluacion ? `
          <div class="img-box">
            <div class="caption">Evaluación de candidatos</div>
            <img src="${p.imagenEvaluacion}" alt="Evaluación ${etiquetaPartida(p)}" loading="lazy">
            <a class="btn secondary" href="${p.imagenEvaluacion}" download>⬇ Descargar</a>
          </div>` : ""}
        ${p.imagenGalardon ? `
          <div class="img-box">
            <div class="caption">Galardón</div>
            <img src="${p.imagenGalardon}" alt="Galardón ${etiquetaPartida(p)}" loading="lazy">
            <a class="btn secondary" href="${p.imagenGalardon}" download>⬇ Descargar</a>
          </div>` : ""}
      </div>
    </div>
  `).join("");
}

(async function init() {
  const datos = await cargarDatos();
  render(datos.partidas);
})();
</script>
</body>
</html>
