<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificacion — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>⚔ Comunidad AoE II</h1>
    <span class="sub">Clasificación</span>
  </div>
  <nav class="tabs">
    <a href="index.html" class="active">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="section-head">
    <h2>Tabla de posiciones</h2>
    <span class="meta" id="resumen-periodo"></span>
  </div>

  <div class="filters">
    <select id="filtro-periodo"></select>
  </div>

  <div id="contenedor-standings" class="standings">
    <div class="empty-state">Cargando…</div>
  </div>
</main>

<nav class="mobile-nav">
  <a href="index.html" class="active"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
let TODAS_LAS_PARTIDAS = [];
let EQUIVALENCIAS = [];

function poblarFiltroPeriodo() {
  const select = document.getElementById("filtro-periodo");
  const claves = [...new Set(TODAS_LAS_PARTIDAS.map(clavePeriodo))].sort().reverse();
  if (claves.length === 0) {
    select.innerHTML = `<option value="">Sin partidas</option>`;
    return;
  }
  select.innerHTML = claves.map(c => `<option value="${c}">${nombrePeriodo(c)}</option>`).join("");
  select.addEventListener("change", renderizar);
}

function renderizar() {
  const periodo = document.getElementById("filtro-periodo").value;
  const partidasDelPeriodo = TODAS_LAS_PARTIDAS.filter(p => clavePeriodo(p) === periodo);

  document.getElementById("resumen-periodo").textContent =
    `${partidasDelPeriodo.length} partida${partidasDelPeriodo.length === 1 ? "" : "s"} registrada${partidasDelPeriodo.length === 1 ? "" : "s"}`;

  const stats = calcularEstadisticasJugadores(partidasDelPeriodo, EQUIVALENCIAS);
  const lista = Object.values(stats).sort((a, b) => b.puntos - a.puntos);

  const cont = document.getElementById("contenedor-standings");

  if (lista.length === 0) {
    cont.innerHTML = `<div class="empty-state">No hay partidas registradas para este período todavía.</div>`;
    return;
  }

  cont.innerHTML = lista.map((j, i) => {
    const rankClass = i === 0 ? "rank-1" : i === 1 ? "rank-2" : i === 2 ? "rank-3" : "";
    return `
      <div class="standings-row ${rankClass}">
        <div class="rank-num">${i + 1}</div>
        <div class="player-cell">
          <div class="name"><a href="jugador.html?nombre=${encodeURIComponent(j.nombre)}">${j.nombre}</a></div>
          <div class="subline">${j.victorias}V - ${j.derrotas}D</div>
        </div>
        <div class="stat-cell">
          <span class="vpj">${j.partidas} PJ</span>
          <span class="pts">${j.puntos}</span>
        </div>
      </div>
    `;
  }).join("");
}

(async function init() {
  const datos = await cargarDatos();
  TODAS_LAS_PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  poblarFiltroPeriodo();
  renderizar();
})();
</script>
</body>
</html>
