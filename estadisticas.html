<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .subtabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .subtab-btn {
    background: var(--panel-raised); color: var(--text-dim); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .subtab-btn.active { background: var(--gold); color: #17130a; border-color: var(--gold); }
  .player-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 10px; margin-bottom: 14px; }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .compare-table th, .compare-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; }
  .compare-table th:first-child, .compare-table td:first-child { text-align: left; color: var(--text-dim); }
  .compare-table thead th { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>⚔ Comunidad AoE II</h1>
    <span class="sub">Estadísticas</span>
  </div>
  <nav class="tabs">
    <a href="index.html">Inicio</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html" class="active">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="subtabs">
    <button class="subtab-btn active" data-tab="tiempos" onclick="cambiarSubtab('tiempos')">⏱ Tiempos</button>
    <button class="subtab-btn" data-tab="civs" onclick="cambiarSubtab('civs')">🏛 Civs / WR</button>
    <button class="subtab-btn" data-tab="sinergia" onclick="cambiarSubtab('sinergia')">🤝 Sinergia</button>
  </div>

  <div class="panel">
    <h3>Selecciona de 2 a 4 jugadores</h3>
    <div class="player-picker">
      <input type="text" id="jug-1" list="lista-nombres" placeholder="Jugador 1">
      <input type="text" id="jug-2" list="lista-nombres" placeholder="Jugador 2">
      <input type="text" id="jug-3" list="lista-nombres" placeholder="Jugador 3 (opc.)">
      <input type="text" id="jug-4" list="lista-nombres" placeholder="Jugador 4 (opc.)">
    </div>
    <datalist id="lista-nombres"></datalist>
    <button class="btn" onclick="consultar()">Consultar</button>
  </div>

  <div id="resultado" class="panel" style="display:none;"></div>
</main>

<nav class="mobile-nav">
  <a href="index.html"><span class="icon">🏠</span>Inicio</a>
  <a href="clasificacion.html"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html" class="active"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
let PARTIDAS = [], EQUIVALENCIAS = [];
let subtabActual = "tiempos";

function cambiarSubtab(tab) {
  subtabActual = tab;
  document.querySelectorAll(".subtab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("resultado").style.display = "none";
}

function nombresSeleccionados() {
  return ["jug-1","jug-2","jug-3","jug-4"]
    .map(id => document.getElementById(id).value.trim())
    .filter(Boolean);
}

function consultar() {
  const nombres = nombresSeleccionados();
  if (nombres.length < 2) { alert("Selecciona al menos 2 jugadores."); return; }

  const resultadoDiv = document.getElementById("resultado");
  resultadoDiv.style.display = "block";

  if (subtabActual === "tiempos") {
    const datos = compararJugadores(nombres, PARTIDAS, EQUIVALENCIAS);
    resultadoDiv.innerHTML = `
      <h3>⏱ Comparativa de Tiempos y Estadísticas</h3>
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead><tr><th>Métrica</th>${datos.map(d => `<th>${d.nombre}</th>`).join("")}</tr></thead>
          <tbody>
            <tr><td>Partidas</td>${datos.map(d => `<td>${d.partidas}</td>`).join("")}</tr>
            <tr><td>Tiempo total</td>${datos.map(d => `<td>${formatearDuracion(d.segundosTotales)}</td>`).join("")}</tr>
            <tr><td>Prom. duración</td>${datos.map(d => `<td>${formatearDuracion(d.partidas ? Math.round(d.segundosTotales / d.partidas) : 0)}</td>`).join("")}</tr>
            <tr><td>Unid. asesinadas</td>${datos.map(d => `<td>${d.unidadesAsesinadas}</td>`).join("")}</tr>
            <tr><td>Prom. unidades</td>${datos.map(d => `<td>${d.partidas ? (d.unidadesAsesinadas / d.partidas).toFixed(1) : 0}</td>`).join("")}</tr>
            <tr><td>Edif. arrasados</td>${datos.map(d => `<td>${d.edificiosArrasados}</td>`).join("")}</tr>
            <tr><td>Prom. edificios</td>${datos.map(d => `<td>${d.partidas ? (d.edificiosArrasados / d.partidas).toFixed(1) : 0}</td>`).join("")}</tr>
          </tbody>
        </table>
      </div>
    `;
  }

  if (subtabActual === "civs") {
    const datos = compararJugadores(nombres, PARTIDAS, EQUIVALENCIAS);
    const todasLasCivs = [...new Set(datos.flatMap(d => Object.keys(d.civs)))].sort();
    if (todasLasCivs.length === 0) {
      resultadoDiv.innerHTML = `<div class="empty-state">Sin datos de civilización para estos jugadores.</div>`;
      return;
    }
    resultadoDiv.innerHTML = `
      <h3>🏛 Comparativa de Civilizaciones</h3>
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead><tr><th>Civ</th>${datos.map(d => `<th>${d.nombre}</th>`).join("")}</tr></thead>
          <tbody>
            ${todasLasCivs.map(civ => `
              <tr>
                <td>${civ}</td>
                ${datos.map(d => {
                  const c = d.civs[civ];
                  if (!c) return `<td>—</td>`;
                  const wr = Math.round((c.victorias / c.jugadas) * 100);
                  return `<td>${c.jugadas}p (${wr}%)</td>`;
                }).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  if (subtabActual === "sinergia") {
    const s = calcularSinergia(nombres, PARTIDAS, EQUIVALENCIAS);
    if (s.partidasJuntos === 0) {
      resultadoDiv.innerHTML = `
        <h3>🤝 Sinergia Grupal</h3>
        <div class="empty-state">⚠ Estos jugadores nunca jugaron juntos en el mismo equipo.</div>
      `;
      return;
    }
    resultadoDiv.innerHTML = `
      <h3>🤝 Sinergia Grupal</h3>
      <p class="hint">${nombres.join(", ")}</p>
      <div class="stat-grid">
        <div class="stat-tile"><span class="num">${s.partidasJuntos}</span><span class="label">Partidas juntos</span></div>
        <div class="stat-tile"><span class="num">${s.victorias}</span><span class="label">Victorias</span></div>
        <div class="stat-tile"><span class="num">${s.derrotas}</span><span class="label">Derrotas</span></div>
        <div class="stat-tile"><span class="num">${s.efectividad}%</span><span class="label">Efectividad</span></div>
      </div>
    `;
  }
}

(async function init() {
  const datos = await cargarDatos();
  PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  document.getElementById("lista-nombres").innerHTML =
    listaDeNombresOficiales(PARTIDAS, EQUIVALENCIAS).map(n => `<option value="${n}">`).join("");
})();
</script>
</body>
</html>
