<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .bienvenida { text-align: center; padding: 10px 0 24px; }
  .bienvenida h1 { font-size: 1.6rem; color: var(--text); margin-bottom: 6px; }
  .bienvenida .lema { color: var(--text-dim); font-size: 0.95rem; }
  .galardon-destacado { text-align: center; }
  .galardon-destacado img {
    max-width: 100%; max-height: 72vh; border-radius: 6px;
    border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  .galardon-destacado .etiqueta {
    margin-top: 14px; font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.05rem;
  }
  .galardon-destacado .subetiqueta { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="sub">Inicio</span>
  </div>
  <nav class="tabs">
    <a href="index.html" class="active">Inicio</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="bienvenida">
    <h1>Ranking Maratón Michi DM</h1>
    <div class="lema">Bienvenido al portal oficial del torneo.</div>
  </div>

  <div id="contenedor-galardon" class="galardon-destacado">
    <div class="empty-state">Cargando…</div>
  </div>
</main>

<nav class="mobile-nav">
  <a href="index.html" class="active"><span class="icon">🏠</span>Inicio</a>
  <a href="clasificacion.html"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
(async function init() {
  const datos = await cargarDatos();
  const cont = document.getElementById("contenedor-galardon");

  const lista = datos.jornadasImagenes || [];
  const conGalardon = lista.filter(j => j.imagenGalardon);
  if (conGalardon.length === 0) {
    cont.innerHTML = `<div class="empty-state">Todavía no se ha publicado ningún galardón.</div>`;
    return;
  }

  conGalardon.sort((a, b) =>
    claveOrden({ anio: b.anio, mes: b.mes, jornada: b.jornada, numeroPartida: 0 }) -
    claveOrden({ anio: a.anio, mes: a.mes, jornada: a.jornada, numeroPartida: 0 })
  );
  const ultima = conGalardon[0];

  cont.innerHTML = `
    <img src="${ultima.imagenGalardon}" alt="Galardón ${ultima.jornada}">
    <div class="etiqueta">👑 ${ultima.jornada}</div>
    <div class="subetiqueta">${NOMBRES_MES[ultima.mes]} ${ultima.anio}</div>
  `;
})();
</script>
</body>
</html>
