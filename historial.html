<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial — Comunidad AoE II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .jornada-block { margin-bottom: 22px; }
  .jornada-block > h3 { color: var(--gold); font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .match-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .match-card .cabecera { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .match-card .cabecera .titulo { font-weight: 600; font-size: 0.88rem; }
  .match-card .cabecera .dur { font-size: 0.78rem; color: var(--text-dim); }
  .fila-jugador { display:grid; grid-template-columns: 20px 1fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  .fila-jugador:last-child { border-bottom: none; }
  .fila-jugador .bonos { font-size: 0.7rem; color: var(--patina-bright); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>⚔ Comunidad AoE II</h1>
    <span class="sub">Historial de partidas</span>
  </div>
  <nav class="tabs">
    <a href="index.html">Inicio</a>
    <a href="clasificacion.html">Clasificación</a>
    <a href="jugador.html">Jugadores</a>
    <a href="estadisticas.html">Estadísticas</a>
    <a href="candidatos.html">Candidatos</a>
    <a href="historial.html" class="active">Historial</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div class="filters">
    <select id="filtro-periodo"></select>
  </div>
  <div id="lista-historial"></div>
</main>

<nav class="mobile-nav">
  <a href="index.html"><span class="icon">🏠</span>Inicio</a>
  <a href="clasificacion.html"><span class="icon">🏆</span>Ranking</a>
  <a href="jugador.html"><span class="icon">🧑‍🤝‍🧑</span>Jugadores</a>
  <a href="estadisticas.html"><span class="icon">📈</span>Stats</a>
  <a href="candidatos.html"><span class="icon">⭐</span>Candidatos</a>
  <a href="historial.html" class="active"><span class="icon">📜</span>Historial</a>
</nav>

<script src="js/datos.js"></script>
<script>
let PARTIDAS = [], EQUIVALENCIAS = [];

function render() {
  const periodo = document.getElementById("filtro-periodo").value;
  const filtradas = PARTIDAS.filter(p => clavePeriodo(p) === periodo)
    .sort((a, b) => claveOrden(b) - claveOrden(a));

  const cont = document.getElementById("lista-historial");
  if (filtradas.length === 0) {
    cont.innerHTML = `<div class="empty-state">No hay partidas registradas para este período.</div>`;
    return;
  }

  // Agrupar por jornada, conservando el orden ya descendente
  const grupos = [];
  filtradas.forEach(p => {
    let grupo = grupos.find(g => g.jornada === p.jornada);
    if (!grupo) { grupo = { jornada: p.jornada, partidas: [] }; grupos.push(grupo); }
    grupo.partidas.push(p);
  });

  cont.innerHTML = grupos.map(g => `
    <div class="jornada-block">
      <h3>${g.jornada}</h3>
      ${g.partidas.map(p => `
        <div class="match-card">
          <div class="cabecera">
            <span class="titulo">Partida ${p.numeroPartida}</span>
            <span class="dur">${formatearDuracion(p.duracionSeg)}</span>
          </div>
          ${p.jugadores.map(j => {
            const nombreOf = resolverNombreOficial(j.nombre, EQUIVALENCIAS);
            const gano = j.resultado === "victoria";
            const bonosTexto = (j.bonos || []).map(b => ETIQUETAS_BONO[b] || b).join(", ");
            return `
              <div class="fila-jugador">
                <span class="match-badge ${gano ? 'win' : 'loss'}"></span>
                <span>
                  <a href="jugador.html?nombre=${encodeURIComponent(nombreOf)}">${nombreOf}</a>
                  <span style="color:var(--text-dim); font-size:0.78rem;"> — ${j.civ || "—"} ${j.equipo ? "· " + j.equipo : ""}</span>
                  ${bonosTexto ? `<div class="bonos">${bonosTexto}</div>` : ""}
                </span>
                <span style="font-size:0.78rem; color:var(--text-dim);">${j.unidadesAsesinadas || 0} un. / ${j.edificiosArrasados || 0} ed.</span>
              </div>
            `;
          }).join("")}
        </div>
      `).join("")}
    </div>
  `).join("");
}

function poblarFiltro() {
  const select = document.getElementById("filtro-periodo");
  const claves = [...new Set(PARTIDAS.map(clavePeriodo))].sort().reverse();
  if (claves.length === 0) {
    select.innerHTML = `<option value="">Sin partidas</option>`;
    return;
  }
  select.innerHTML = claves.map(c => `<option value="${c}">${nombrePeriodo(c)}</option>`).join("");
  select.addEventListener("change", render);
}

(async function init() {
  const datos = await cargarDatos();
  PARTIDAS = datos.partidas;
  EQUIVALENCIAS = datos.equivalencias;
  poblarFiltro();
  render();
})();
</script>
</body>
</html>
